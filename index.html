<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cell Fix · Finanzas</title>
<style>
:root{--bg:#f0f4f9;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;--pri:#3b82f6;--ok:#059669;--bad:#dc2626;--soft:#eaf1ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c2e;--tx:#f1f5f9;--mut:#94a3b8;--bd:#24304a;--soft:#18284a;--ok:#34d399;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c2e;--tx:#f1f5f9;--mut:#94a3b8;--bd:#24304a;--soft:#18284a;--ok:#34d399;--bad:#f87171}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
.w{max-width:520px;margin:0 auto;padding:20px 16px}
h1{font-size:28px;margin:8px 0 2px}h2{font-size:17px;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.v{font-size:22px;font-weight:700}
.ok{color:var(--ok)}.bad{color:var(--bad)}.pri{color:var(--pri)}
input,select{width:100%;padding:13px 14px;border:1px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}
label{font-size:13px;font-weight:600;color:var(--mut)}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--pri);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.seg{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:14px;margin-bottom:12px}
.seg button{flex:1;padding:10px;border:0;border-radius:11px;background:transparent;color:var(--mut);font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bar{height:12px;background:var(--bg);border-radius:8px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.row small{color:var(--mut);display:block}
.x{border:0;background:none;color:var(--mut);font-size:20px;cursor:pointer}
.chart{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:8px}
.chart div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.chart b{display:block;background:var(--pri);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:11px;padding:6px 2px;border-radius:12px;cursor:pointer}
nav button.on{color:var(--pri);background:var(--soft);font-weight:700}
nav span{display:block;font-size:20px}
.msg{padding:12px;border-radius:12px;margin-top:10px;font-weight:700;text-align:center}
.hb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(14px,calc(50% - 246px));z-index:30;width:44px;height:44px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:22px;cursor:pointer}
.mn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);right:max(14px,calc(50% - 246px));z-index:30;width:260px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.mn button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tx);font:inherit;padding:12px;border-radius:12px;cursor:pointer}
.mn button:hover{background:var(--soft)}
.ov{position:fixed;inset:0;z-index:25}
details summary{cursor:pointer;list-style:none}details[open] summary{margin-bottom:8px}
/* Liquid glass */
:root{--gl:rgba(255,255,255,.55);--gl2:rgba(255,255,255,.85);--glb:rgba(255,255,255,.75);--inp:rgba(255,255,255,.6);--sh:0 8px 32px rgba(31,60,120,.16)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gl:rgba(32,44,72,.45);--gl2:rgba(90,120,190,.38);--glb:rgba(255,255,255,.14);--inp:rgba(255,255,255,.06);--sh:0 8px 32px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--gl:rgba(32,44,72,.45);--gl2:rgba(90,120,190,.38);--glb:rgba(255,255,255,.14);--inp:rgba(255,255,255,.06);--sh:0 8px 32px rgba(0,0,0,.45)}
body{background:radial-gradient(60% 40% at 12% 0%,rgba(59,130,246,.30),transparent 70%),radial-gradient(50% 35% at 100% 22%,rgba(168,85,247,.20),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(16,185,129,.18),transparent 70%),var(--bg);background-attachment:fixed;padding-bottom:120px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
.v{font-weight:800;letter-spacing:-.01em}
.card{background:var(--gl);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--glb);border-radius:24px;box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.35)}
input,select{background:var(--inp);border-radius:16px}
.btn{background:linear-gradient(135deg,#5aa2ff,#3b6ff5);box-shadow:0 6px 18px rgba(59,130,246,.35),inset 0 1px 0 rgba(255,255,255,.35);border-radius:18px}
.seg{background:rgba(120,140,180,.18);border-radius:18px}
.seg button.on{background:var(--gl2);box-shadow:0 2px 8px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.5)}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:496px;margin:0 auto;padding:6px;border:1px solid var(--glb);border-radius:32px;background:var(--gl);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.08)}
nav button{border-radius:24px;transition:background .25s,box-shadow .25s,color .25s}
nav button.on{background:var(--gl2);color:var(--pri);box-shadow:0 2px 12px rgba(59,130,246,.28),inset 0 1px 0 rgba(255,255,255,.6)}
.hb{background:var(--gl);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glb);border-radius:50%;box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.5)}
.mn{background:var(--gl);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--glb);border-radius:26px;box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.5)}
.mn button{border-radius:18px}.mn button:hover{background:var(--gl2)}
.ov{background:rgba(0,0,0,.12);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){.card{animation:fi .3s ease both}}
nav{overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;font-size:10px;padding:6px 7px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:90%;padding:12px 18px;border-radius:20px;background:var(--gl2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--glb);box-shadow:var(--sh);color:var(--tx);font-weight:600;text-align:center;z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
</style>
</head>
<body>
<div class="w" id="app"></div>
<nav id="nav"></nav>
<div id="menu"></div>
<div id="toast"></div>
<script>
var KEY='cellfix_finanzas_v1';
var S={tx:[],meta:0,fondo:0,fijos:[],cobros:[],precios:[],prestamos:[]};
try{var raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function hoy(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function L(n){return 'L '+(Number(n)||0).toLocaleString('es-HN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var CAT={ingreso:['Reparación','Venta de accesorio','Otro ingreso'],gasto:['Repuestos','Alquiler','Servicios (luz, internet)','Publicidad','Salarios','Otro gasto']};
var tab='resumen',tipo='ingreso',mes=hoy().slice(0,7),msg='';
function sumas(list){var i=0,g=0,c=0;list.forEach(function(t){if(t.tipo==='ingreso'){i+=t.monto;c+=t.costo||0;}else if(t.tipo==='gasto'||(t.tipo==='salida'&&t.prestamoId))g+=t.monto;});return{ing:i,gas:g,costo:c,gan:i-c-g};}
function nav(){var T=[['resumen','📊','Resumen'],['cobrar','🤝','Por cobrar'],['mov','🧾','Movimientos'],['fijos','📅','Fijos'],['verpre','🏷️','Precios'],['corte','💵','Corte']];
document.getElementById('nav').innerHTML=T.map(function(t){return '<button class="'+(tab===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>';}).join('');}
function go(t){tab=t;msg='';menu=false;render();window.scrollTo(0,0);}
function vResumen(){
 var l=S.tx.filter(function(t){return t.fecha.slice(0,7)===mes;}),s=sumas(l);
 var pct=S.meta>0?Math.min(100,Math.round(s.ing/S.meta*100)):0;
 var dias=[],mx=1,i;
 for(i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var f=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  var a=S.tx.filter(function(t){return t.fecha===f&&t.tipo==='ingreso';}).reduce(function(x,t){return x+t.monto;},0);dias.push([f.slice(8),a]);mx=Math.max(mx,a);}
 var porCat={};l.filter(function(t){return t.tipo==='gasto'||(t.tipo==='salida'&&t.prestamoId);}).forEach(function(t){porCat[t.cat]=(porCat[t.cat]||0)+t.monto;});
 var cats=Object.keys(porCat).sort(function(a,b){return porCat[b]-porCat[a];});
 return '<h1>Cell Fix</h1><p class="sub">Control financiero</p>'+
 '<label>Mes</label><input type="month" value="'+mes+'" onchange="mes=this.value||mes;render()">'+
 '<div class="grid"><div class="card"><div class="k">Ingresos</div><div class="v ok">'+L(s.ing)+'</div></div>'+
 '<div class="card"><div class="k">Gastos</div><div class="v bad">'+L(s.gas)+'</div></div>'+
 '<div class="card" style="grid-column:1/-1"><div class="k">Ganancia neta</div><div class="v '+(s.gan>=0?'ok':'bad')+'">'+L(s.gan)+'</div></div></div>'+
 '<div class="card"><h2>Meta del mes</h2><label>Meta de ingresos (L)</label><input type="number" inputmode="decimal" value="'+(S.meta||'')+'" placeholder="Ej: 30000" onchange="S.meta=+this.value||0;save();render()">'+
 (S.meta>0?'<div class="bar"><i style="width:'+pct+'%"></i></div><small class="sub">'+pct+'% · faltan '+L(Math.max(0,S.meta-s.ing))+'</small>':'')+'</div>'+
 '<div class="card"><h2>Ingresos últimos 7 días</h2><div class="chart">'+dias.map(function(d){return '<div><b style="height:'+Math.round(d[1]/mx*80)+'px"></b>'+d[0]+'</div>';}).join('')+'</div></div>'+
 '<div class="card"><h2>Gastos por categoría</h2>'+(cats.length?cats.map(function(c){return '<div class="row"><span>'+esc(c)+'</span><b>'+L(porCat[c])+'</b></div>';}).join(''):'<p class="sub">Sin gastos este mes.</p>')+'</div>';}
function vNuevo(){
 return '<h1>Registrar</h1><p class="sub">Ingreso o gasto</p><div class="card"><div class="seg"><button class="'+(tipo==='ingreso'?'on':'')+'" onclick="tipo=\'ingreso\';render()">Ingreso</button><button class="'+(tipo==='gasto'?'on':'')+'" onclick="tipo=\'gasto\';render()">Gasto</button></div>'+
 '<label>Categoría</label><select id="cat">'+CAT[tipo].map(function(c){return '<option>'+c+'</option>';}).join('')+'</select>'+
 '<label>Descripción</label><input id="desc" placeholder="'+(tipo==='ingreso'?'Ej: Pantalla iPhone 11':'Ej: Pago de luz')+'">'+
 '<label>Monto (L)</label><input id="monto" type="number" inputmode="decimal" placeholder="0.00">'+
 (tipo==='ingreso'?'<label>Costo del repuesto (L, opcional)</label><input id="costo" type="number" inputmode="decimal" placeholder="0.00">':'')+
 '<label>Método de pago</label><select id="met"><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option></select>'+
 '<label>Fecha</label><input id="fecha" type="date" value="'+hoy()+'">'+
 '<button class="btn" onclick="add()">Guardar</button>'+(msg?'<div class="msg ok">'+msg+'</div>':'')+'</div>';}
function add(){
 var m=+document.getElementById('monto').value;if(!(m>0)){msg='';alert('Escribe un monto mayor a 0');return;}
 var c=document.getElementById('costo');
 S.tx.push({id:Date.now(),tipo:tipo,cat:document.getElementById('cat').value,desc:document.getElementById('desc').value,monto:m,costo:c?(+c.value||0):0,metodo:document.getElementById('met').value,fecha:document.getElementById('fecha').value||hoy()});
 save();msg='✓ Guardado';render();}
function vMov(){
 var l=S.tx.slice().sort(function(a,b){return b.fecha.localeCompare(a.fecha)||b.id-a.id;}).slice(0,60);
 return '<h1>Movimientos</h1><p class="sub">Últimos registros</p><div class="grid" style="margin-bottom:14px"><button class="btn" style="background:var(--ok)" onclick="setMf(1)">＋ Entrada</button><button class="btn" style="background:var(--bad)" onclick="setMf(2)">− Salida</button></div><button class="btn" style="background:var(--soft);color:var(--pri);margin-bottom:14px" onclick="goNuevo()">Registrar ingreso o gasto</button>'+formMov()+'<div class="card">'+(l.length?l.map(function(t){
  var g=t.tipo==='ingreso'||t.tipo==='entrada';
  return '<div class="row"><div><b>'+esc(t.desc||t.cat)+'</b><small>'+t.fecha+' · '+esc(t.cat)+' · '+t.metodo+(g&&t.costo?' · ganancia '+L(t.monto-t.costo):'')+'</small></div><div style="text-align:right"><b class="'+(g?'ok':'bad')+'">'+(g?'+':'−')+L(t.monto)+'</b></div><button class="x" onclick="del('+t.id+')">×</button></div>';}).join(''):'<p class="sub">Aún no hay movimientos.</p>')+'</div>';}
var mf='';
var fa=0,ca=0;
var MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fd(x){return x.getDate()+' '+MES[x.getMonth()];}
function fs(x){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function goNuevo(){go('nuevo');}
function ciclo(){var d=new Date(),m=d.getMonth();if(d.getDate()<15)m--;var y=d.getFullYear(),s=new Date(y,m,15),e=new Date(y,m+1,14),n=new Date(y,m+1,15),t=new Date(y,d.getMonth(),d.getDate());return{id:fs(s),ini:s,fin:e,reset:Math.round((n-t)/864e5)};}
function vFijos(){var c=ciclo(),tot=0,ab=0;
 var rows=S.fijos.map(function(f){var p=S.tx.filter(function(t){return t.fijoId===f.id&&t.ciclo===c.id;});var a=p.reduce(function(x,t){return x+t.monto;},0);tot+=f.monto;ab+=Math.min(a,f.monto);var pend=Math.max(0,f.monto-a),pc=Math.min(100,Math.round(a/f.monto*100));
  return '<div class="card"><div class="row" style="border:0;padding:0"><div><b>'+esc(f.nombre)+'</b><small>'+L(f.monto)+' por ciclo</small></div><button class="x" onclick="delFijo('+f.id+')">×</button></div><div class="bar"><i style="width:'+pc+'%;background:'+(pend===0?'var(--ok)':'var(--pri)')+'"></i></div><div class="row" style="border:0;padding:4px 0"><span>Abonado <b class="ok">'+L(a)+'</b></span><span>Pendiente <b class="'+(pend?'bad':'ok')+'">'+L(pend)+'</b></span></div>'+
  p.map(function(t){return '<div class="row"><div><b>'+L(t.monto)+'</b><small>'+t.fecha+' · '+esc(t.razon||'Sin razón')+' · '+t.metodo+'</small></div><button class="x" onclick="del('+t.id+')">×</button></div>';}).join('')+
  (fa===f.id?formAbono(f.id):'<button class="btn" style="margin-top:8px" onclick="fa='+f.id+';render()">Abonar</button>')+'</div>';}).join('');
 return '<h1>Gastos fijos</h1><p class="sub">Ciclo del '+fd(c.ini)+' al '+fd(c.fin)+' · se reinicia en '+c.reset+' día'+(c.reset===1?'':'s')+'</p><div class="grid"><div class="card"><div class="k">Total fijos</div><div class="v">'+L(tot)+'</div></div><div class="card"><div class="k">Pendiente</div><div class="v bad">'+L(Math.max(0,tot-ab))+'</div></div></div>'+rows+'<div class="card"><h2>Nuevo gasto fijo</h2><label>Nombre</label><input id="fn" placeholder="Ej: Alquiler del local"><label>Monto por ciclo (L)</label><input id="fm" type="number" inputmode="decimal" placeholder="0.00"><button class="btn" onclick="addFijo()">Agregar</button></div>';}
function formAbono(id){return '<div style="margin-top:10px"><label>Monto del abono (L)</label><input id="ab_m" type="number" inputmode="decimal" placeholder="0.00"><label>Razón</label><input id="ab_r" placeholder="Ej: Primera quincena"><label>Método</label><select id="ab_t"><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option></select><button class="btn" onclick="abonarFijo('+id+')">Guardar abono</button><button class="btn" style="background:var(--bg);color:var(--mut);margin-top:8px" onclick="fa=0;render()">Cancelar</button></div>';}
function abonarFijo(id){var f=S.fijos.filter(function(x){return x.id===id;})[0];var m=+document.getElementById('ab_m').value;if(!(m>0)){alert('Escribe un monto mayor a 0');return;}var r=document.getElementById('ab_r').value.trim();if(!r){alert('Escribe la razón del abono');return;}S.tx.push({id:Date.now(),tipo:'gasto',cat:'Gasto fijo',desc:f.nombre+' · '+r,razon:r,monto:m,costo:0,metodo:document.getElementById('ab_t').value,fecha:hoy(),fijoId:id,ciclo:ciclo().id});fa=0;save();render();}
function addFijo(){var n=document.getElementById('fn').value.trim(),m=+document.getElementById('fm').value;if(!n||!(m>0)){alert('Escribe el nombre y un monto mayor a 0');return;}S.fijos.push({id:Date.now(),nombre:n,monto:m});save();render();}
function delFijo(id){if(sure('f'+id,'Toca la × otra vez para eliminar. Los abonos hechos se conservan.')){S.fijos=S.fijos.filter(function(f){return f.id!==id;});save();render();}}
function cobrado(c){return S.tx.filter(function(t){return t.cobroId===c.id;}).reduce(function(x,t){return x+t.monto;},0);}
function vCobrar(){var pend=0,list=S.cobros.map(function(c){return{c:c,p:Math.max(0,Math.round((c.total-cobrado(c))*100)/100)};});
 list.forEach(function(o){pend+=o.p;});
 var abiertos=list.filter(function(o){return o.p>0;}),saldados=list.filter(function(o){return o.p===0;}).slice(-5).reverse();
 function card(o){var c=o.c,cb=cobrado(c),pc=Math.min(100,Math.round(cb/c.total*100));
  return '<div class="card"><div class="row" style="border:0;padding:0"><div><b>'+esc(c.cliente)+'</b><small>'+esc(c.concepto)+' · '+c.fecha+'</small>'+(c.tel||c.disp?'<small>'+(c.disp?'📱 '+esc(c.disp):'')+(c.disp&&c.tel?' · ':'')+(c.tel?'📞 '+esc(c.tel):'')+'</small>':'')+(c.det?'<small>'+esc(c.det)+'</small>':'')+'</div><button class="x" onclick="delCobro('+c.id+')">×</button></div><div class="bar"><i style="width:'+pc+'%;background:'+(o.p===0?'var(--ok)':'var(--pri)')+'"></i></div><div class="row" style="border:0;padding:4px 0"><span>Cobrado <b class="ok">'+L(cb)+'</b> de '+L(c.total)+'</span><span>Debe <b class="'+(o.p?'bad':'ok')+'">'+L(o.p)+'</b></span></div>'+(c.nfotos?'<button class="btn" style="background:var(--soft);color:var(--pri);box-shadow:none;margin-bottom:8px" onclick="verFotos('+c.id+')">📷 Ver fotos ('+c.nfotos+')</button>':'')+(o.p>0?(ca===c.id?formCobro(c.id):'<button class="btn" onclick="ca='+c.id+';render()">Registrar abono</button>'):'')+'</div>';}

function listaPre(){var l=S.precios.filter(function(p){return p.nombre.toLowerCase().indexOf(qp.trim().toLowerCase())>-1;}).sort(function(a,b){return a.nombre.localeCompare(b.nombre);});
 return l.length?l.map(function(p){if(ep===p.id)return '<div class="card"><label>Reparación</label><input id="en" value="'+esc(p.nombre)+'"><div class="grid"><div><label>Precio final (L)</label><input id="ef" type="number" inputmode="decimal" value="'+p.pfin+'"></div><div><label>Mayorista (L)</label><input id="em" type="number" inputmode="decimal" value="'+(p.pmay||'')+'"></div></div><button class="btn" onclick="savePre('+p.id+')">Guardar</button><button class="btn" style="background:var(--bg);color:var(--mut);margin-top:8px" onclick="ep=0;render()">Cancelar</button></div>';
  return '<div class="card"><div class="row" style="border:0;padding:0"><b>'+esc(p.nombre)+'</b><div><button class="x" onclick="ep='+p.id+';render()">✏️</button><button class="x" onclick="delPre('+p.id+')">×</button></div></div><div class="grid" style="margin-top:8px"><div><div class="k">Final</div><div class="v">'+L(p.pfin)+'</div></div><div><div class="k">Mayorista</div><div class="v pri">'+(p.pmay>0?L(p.pmay):'—')+'</div></div></div></div>';}).join(''):'<div class="card"><p class="sub">'+(S.precios.length?'No se encontró esa reparación.':'Todavía no hay precios. Agrega el primero arriba.')+'</p></div>';}
function addPre(){var n=document.getElementById('pn').value.trim(),f=+document.getElementById('pf').value,m=+document.getElementById('pm').value||0;if(!n||!(f>0)){alert('Escribe la reparación y el precio final');return;}S.precios.push({id:Date.now(),nombre:n,pfin:f,pmay:m});save();render();}
function savePre(id){var n=document.getElementById('en').value.trim(),f=+document.getElementById('ef').value,m=+document.getElementById('em').value||0;if(!n||!(f>0)){alert('Escribe la reparación y el precio final');return;}S.precios.forEach(function(p){if(p.id===id){p.nombre=n;p.pfin=f;p.pmay=m;}});ep=0;save();render();}
function delPre(id){if(sure('p'+id)){S.precios=S.precios.filter(function(p){return p.id!==id;});save();render();}}
function goHist(){go('hist');}
function goHF(){go('histfijos');}
function renderMenu(){document.getElementById('menu').innerHTML='<button class="hb" onclick="tgl()" aria-label="Menú">'+(menu?'✕':'☰')+'</button>'+(menu?'<div class="ov" onclick="tgl()"></div><div class="mn"><button onclick="goCli()">👥 Clientes</button><button onclick="goHist()">📈 Historial semanal</button><button onclick="goHF()">📅 Historial de gastos fijos</button><button onclick="goPre()">🏷️ Lista de precios</button><button onclick="goPres()">💰 Préstamos</button><button onclick="goDrv()">☁️ Fotos en Drive</button></div>':'');}
function wk(f){var p=f.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()-((d.getDay()+6)%7));return d;}
function rowsMov(l){return l.slice().sort(function(a,b){return b.fecha.localeCompare(a.fecha)||b.id-a.id;}).map(function(t){var g=t.tipo==='ingreso'||t.tipo==='entrada';return '<div class="row"><div><b>'+esc(t.desc||t.cat)+'</b><small>'+t.fecha+' · '+esc(t.cat)+' · '+t.metodo+'</small></div><b class="'+(g?'ok':'bad')+'">'+(g?'+':'−')+L(t.monto)+'</b></div>';}).join('');}
function vHist(){var g={};S.tx.forEach(function(t){var k=fs(wk(t.fecha));(g[k]=g[k]||[]).push(t);});
 var ks=Object.keys(g).sort().reverse();
 return '<h1>Historial semanal</h1><p class="sub">De lunes a domingo. Toca una semana para ver el detalle.</p>'+(ks.length?ks.map(function(k){var l=g[k],ing=0,ent=0,sal=0,fij=0,otr=0;
  l.forEach(function(t){if(t.tipo==='ingreso')ing+=t.monto;else if(t.tipo==='entrada')ent+=t.monto;else if(t.tipo==='salida')sal+=t.monto;else if(t.fijoId)fij+=t.monto;else otr+=t.monto;});
  var p=k.split('-'),a=new Date(+p[0],+p[1]-1,+p[2]),b=new Date(a);b.setDate(b.getDate()+6);
  return '<details class="card"><summary><b>'+fd(a)+' – '+fd(b)+'</b><div class="grid" style="margin-top:10px"><div><div class="k">Ventas</div><b class="ok">'+L(ing)+'</b></div><div><div class="k">Entradas</div><b>'+L(ent)+'</b></div><div><div class="k">Salidas</div><b>'+L(sal)+'</b></div><div><div class="k">Gastos fijos</div><b class="bad">'+L(fij)+'</b></div><div><div class="k">Otros gastos</div><b class="bad">'+L(otr)+'</b></div></div></summary>'+rowsMov(l)+'</details>';}).join(''):'<div class="card"><p class="sub">Todavía no hay historial.</p></div>');}
function vHistFijos(){var g={};S.tx.forEach(function(t){if(t.fijoId){(g[t.ciclo]=g[t.ciclo]||[]).push(t);}});
 var ks=Object.keys(g).sort().reverse();
 return '<h1>Historial de gastos fijos</h1><p class="sub">Por ciclo, del 15 al 14. Toca un ciclo para ver los abonos.</p>'+(ks.length?ks.map(function(k){var l=g[k],p=k.split('-'),a=new Date(+p[0],+p[1]-1,+p[2]),b=new Date(a.getFullYear(),a.getMonth()+1,14),tot=l.reduce(function(x,t){return x+t.monto;},0);
  return '<details class="card"><summary><b>'+fd(a)+' – '+fd(b)+'</b><div class="k" style="margin-top:6px">Total abonado</div><b class="bad">'+L(tot)+'</b></summary>'+rowsMov(l)+'</details>';}).join(''):'<div class="card"><p class="sub">Todavía no hay abonos de gastos fijos.</p></div>');}
function setMf(x){mf=x===1?'entrada':x===2?'salida':'';render();}
function formMov(){if(!mf)return '';var e=mf==='entrada';return '<div class="card"><h2>'+(e?'Entrada de dinero':'Salida de dinero')+'</h2><label>Motivo</label><input id="mdesc" placeholder="'+(e?'Ej: Fondo para cambios':'Ej: Retiro del dueño')+'"><label>Monto (L)</label><input id="mmonto" type="number" inputmode="decimal" placeholder="0.00"><label>Método</label><select id="mmet"><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option></select><label>Fecha</label><input id="mfecha" type="date" value="'+hoy()+'"><button class="btn" onclick="addMov()">Guardar</button><button class="btn" style="background:var(--bg);color:var(--mut);margin-top:8px" onclick="setMf(0)">Cancelar</button></div>';}
function addMov(){var m=+document.getElementById('mmonto').value;if(!(m>0)){alert('Escribe un monto mayor a 0');return;}S.tx.push({id:Date.now(),tipo:mf,cat:mf==='entrada'?'Entrada de dinero':'Salida de dinero',desc:document.getElementById('mdesc').value,monto:m,costo:0,metodo:document.getElementById('mmet').value,fecha:document.getElementById('mfecha').value||hoy()});mf='';save();render();}
function del(id){if(sure('t'+id)){S.tx=S.tx.filter(function(t){return t.id!==id;});save();render();}}
function vCorte(){
 var h=hoy(),l=S.tx.filter(function(t){return t.fecha===h&&t.metodo==='Efectivo';});
 var ent=l.filter(function(t){return t.tipo==='ingreso'||t.tipo==='entrada';}).reduce(function(a,t){return a+t.monto;},0);
 var sal=l.filter(function(t){return t.tipo==='gasto'||t.tipo==='salida';}).reduce(function(a,t){return a+t.monto;},0);
 var esp=(S.fondo||0)+ent-sal;
 return '<h1>Corte de caja</h1><p class="sub">Efectivo de hoy ('+h+')</p><div class="card">'+
 '<label>Fondo inicial en caja (L)</label><input type="number" inputmode="decimal" value="'+(S.fondo||'')+'" onchange="S.fondo=+this.value||0;save();render()">'+
 '<div class="row"><span>Entradas en efectivo</span><b class="ok">'+L(ent)+'</b></div><div class="row"><span>Salidas en efectivo</span><b class="bad">'+L(sal)+'</b></div><div class="row"><span>Efectivo esperado</span><b>'+L(esp)+'</b></div>'+
 '<label style="display:block;margin-top:12px">Efectivo contado (L)</label><input id="cont" type="number" inputmode="decimal" placeholder="0.00" oninput="dif('+esp+')"><div id="dif"></div></div>';}
function dif(esp){var v=document.getElementById('cont').value;var el=document.getElementById('dif');if(v===''){el.innerHTML='';return;}
 var d=Math.round((+v-esp)*100)/100;
 el.innerHTML=d===0?'<div class="msg ok">Cuadra perfecto ✓</div>':'<div class="msg '+(d>0?'pri':'bad')+'">'+(d>0?'Sobrante: ':'Faltante: ')+L(Math.abs(d))+'</div>';}
function render(){nav();renderMenu();var v={resumen:vResumen,nuevo:vNuevo,cobrar:vCobrar,mov:vMov,fijos:vFijos,cli:vClientes,pre:vPrecios,verpre:vVerPre,pres:vPres,drv:vDrive,hist:vHist,histfijos:vHistFijos,corte:vCorte}[tab];document.getElementById('app').innerHTML=v();}
render();
</script>
</body>
</html>
